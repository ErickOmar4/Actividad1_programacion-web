<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ejercicio9.css">
    <title>Contacto | DevSolutions</title>
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Contactanos</h1>
        <p class="subtitulo">¿tienes dudas? Escríbenos y te responderemos en 24h. </p>

        <form class="formulario">
            <!---Grupo 1: Datos Basícos-->
            <div class=" grupo-formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="ej:Ana Peréz" required>
            </div>

            <!-- Grupo 2:Email y teléfono-->
             <div class="grupo-doble">
                <div class="grupo-formulario" >
                    <label for="Email">Email </label>
                    <input type="text" id="Email" placeholder="ana@ejemplo.com" required>
                </div>
                <div class="grupo-formulario">
                    <label for="telefono">Telefono <span>(opcional)</span></label>
                    <input type="text" id="telefono" placeholder="+52 55 1234 5678" >
                </div>
             </div>


             <!-- Grupo 3: Mensaje-->
              <div class="grupo-formulario">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Describe tu consulta..." required></textarea>
              </div>

             <!--Botón-->
             <button type="submit" class="boton-enviar">
                Enviar mensaje <samp>-></samp> 
             </button> 
        </form>
    </div>
    <a href="index.html">volver al menu</a>
</body>
</html>
